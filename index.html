<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060912">
<title>TikTok Downloader — by Wall Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060912;
  --panel:#0c1222;
  --line:#1c2a4a;
  --ice:#5ef2ff;
  --violet:#8b6bff;
  --rose:#ff5d8f;
  --text:#e6edff;
  --mute:#8a98bd;
  --ok:#4dffb0;
  --err:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,sans-serif;font-size:15px;line-height:1.5}
body{
  min-height:100vh;
  background:
    radial-gradient(600px 300px at 85% -5%,rgba(139,107,255,.22),transparent 70%),
    radial-gradient(500px 300px at 0% 10%,rgba(94,242,255,.14),transparent 70%),
    linear-gradient(rgba(94,242,255,.035) 1px,transparent 1px) 0 0/36px 36px,
    linear-gradient(90deg,rgba(94,242,255,.035) 1px,transparent 1px) 0 0/36px 36px,
    var(--bg);
  padding:max(18px,env(safe-area-inset-top)) 16px 40px;
}
.wrap{max-width:560px;margin:0 auto}
h1,h2,.display{font-family:'Chakra Petch',system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:34px;height:34px}
.logo b{font-family:'Chakra Petch';font-size:20px;letter-spacing:.04em}
.logo small{display:block;color:var(--ice);font:600 12px 'Chakra Petch',sans-serif;letter-spacing:.08em;margin-top:-2px}
.pill{font-size:11px;color:var(--ice);border:1px solid var(--line);padding:4px 10px;border-radius:99px;background:rgba(94,242,255,.06)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:4px;margin-bottom:18px}
.tab{appearance:none;border:0;background:transparent;color:var(--mute);font:600 14px 'Chakra Petch';padding:11px 8px;border-radius:9px;cursor:pointer;transition:.2s}
.tab[aria-selected="true"]{background:linear-gradient(135deg,rgba(94,242,255,.2),rgba(139,107,255,.25));color:#fff;box-shadow:inset 0 0 0 1px rgba(94,242,255,.45)}

.card{position:relative;background:linear-gradient(180deg,rgba(14,22,42,.95),rgba(10,16,32,.95));border:1px solid var(--line);border-radius:14px;padding:20px 16px 18px}
.card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--ice);pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:14px}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:14px;border-color:var(--violet)}
h2{margin:0 0 4px;font-size:20px}
.sub{color:var(--mute);font-size:13px;margin:0 0 16px}
label{display:block;font-size:12.5px;color:var(--mute);margin:14px 0 6px}
input[type=text],input[type=url],input[type=password],select{
  width:100%;background:#070c19;border:1px solid var(--line);color:var(--text);
  padding:13px 12px;border-radius:10px;font:inherit;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--ice);box-shadow:0 0 0 3px rgba(94,242,255,.15)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.row .fit{flex:0 0 auto}
button{font-family:inherit}
.btn{appearance:none;border:0;cursor:pointer;color:#04101c;font:700 14px 'Chakra Petch';letter-spacing:.03em;padding:13px 16px;border-radius:10px;
  background:linear-gradient(135deg,var(--ice),#7aa8ff);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:var(--ice);border:1px solid var(--line)}
.btn.violet{background:linear-gradient(135deg,var(--violet),var(--rose));color:#fff}
.btn.block{width:100%;margin-top:16px}
.detect{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.chip.on{color:#04101c;background:var(--ice);border-color:var(--ice);font-weight:600}

.result{display:none;margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.result.show{display:block}
.media{display:flex;gap:12px;align-items:flex-start}
.thumb{width:84px;height:112px;object-fit:cover;border-radius:8px;background:#0a1226;border:1px solid var(--line);flex:0 0 auto}
.media h3{margin:0 0 4px;font-size:14px;font-weight:600;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.media p{margin:0;color:var(--mute);font-size:12.5px}
.dl{display:grid;gap:10px;margin-top:14px}
details{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#080d1b}
summary{cursor:pointer;padding:12px 0;color:var(--mute);font-size:13px}
details[open] summary{color:var(--ice)}
details .hint{font-size:12px;color:var(--mute);margin:0 0 12px}

.status{margin-top:14px;font-size:13px;min-height:20px;color:var(--mute)}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
.spin{width:14px;height:14px;border:2px solid rgba(4,16,28,.3);border-top-color:#04101c;border-radius:50%;animation:sp .7s linear infinite;display:none}
.btn.loading .spin{display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

.checks{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.checks label{display:flex;align-items:center;gap:8px;margin:0;color:var(--text);font-size:13.5px}
.checks input{width:18px;height:18px;accent-color:var(--ice)}
.note{margin-top:16px;font-size:12px;color:var(--mute);border-left:2px solid var(--violet);padding-left:10px}
.steps{margin:12px 0 0;padding-left:18px;color:var(--mute);font-size:13px}
.steps li{margin:4px 0}
.steps b{color:var(--text);font-weight:600}
footer{text-align:center;margin-top:26px;color:var(--mute);font-size:12px}
footer b{font-family:'Chakra Petch';color:var(--ice);letter-spacing:.06em}
.panel[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#0e1730;border:1px solid var(--ice);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">
    <svg viewBox="0 0 40 40" fill="none"><path d="M4 8h6l4 16 4-16h4l4 16 4-16h6" stroke="#5ef2ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 32h32" stroke="#8b6bff" stroke-width="2.6" stroke-linecap="round"/></svg>
    <div><b>TIKTOK DOWNLOADER</b><small>by Wall Project</small></div>
  </div>
  <span class="pill">v1.0</span>
</header>

<!-- ============ DOWNLOADER ============ -->
<section class="panel card" id="panel-dl">
  <h2>Unduh video tanpa watermark</h2>
  <p class="sub">Tempel link video TikTok, lalu pilih kualitas.</p>

  <label for="vurl">Link video</label>
  <div class="row">
    <input type="url" id="vurl" inputmode="url" placeholder="https://www.tiktok.com/@user/video/..." autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn ghost fit" id="btnPaste" type="button">Tempel</button>
  </div>
  <div class="detect" aria-live="polite">
    <span class="chip" id="c-tiktok">TikTok</span>
      </div>

  <button class="btn block" id="btnFetch" type="button"><span class="spin"></span><span class="lbl">Ambil video</span></button>
  <div class="status" id="dlStatus" role="status"></div>

  <div class="result" id="result">
    <div class="media">
      <img class="thumb" id="thumb" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
      <div>
        <h3 id="rTitle">—</h3>
        <p id="rMeta">—</p>
      </div>
    </div>
    <div class="dl">
      <button class="btn" id="btnNormal" type="button"><span class="spin"></span><span class="lbl">Without Watermark</span></button>
      <button class="btn violet" id="btnHD" type="button"><span class="spin"></span><span class="lbl">Without Watermark HD</span></button>
    </div>
  </div>

  <p class="note">Unduh hanya video milikmu atau yang pembuatnya izinkan. Hormati hak cipta dan aturan TikTok.</p>
</section>

<footer>by <b>WALL PROJECT</b></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const toastEl = $('toast');
let toastT;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove('show'), 2600);
}
function setStatus(el, msg, type){
  el.textContent = msg || '';
  el.className = 'status' + (type ? ' ' + type : '');
}
function busy(btn, on){
  btn.disabled = on; btn.classList.toggle('loading', on);
}
function storeGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function storeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

async function pasteInto(input){
  try{
    const t = await navigator.clipboard.readText();
    if(t){ input.value = t.trim(); input.dispatchEvent(new Event('input')); return; }
    toast('Clipboard kosong');
  }catch(e){
    toast('Izin clipboard ditolak, tempel manual ya');
    input.focus();
  }
}

/* ---------- Downloader ---------- */
const vurl = $('vurl');
let current = null; // {platform, title, author, cover, normal, hd, picker}

function detect(u){
  if(/tiktok\.com/i.test(u)) return 'tiktok';
  return '';
}
function markChips(){
  const p = detect(vurl.value);
  $('c-tiktok').classList.toggle('on', p==='tiktok');
}
vurl.addEventListener('input', markChips);
$('btnPaste').addEventListener('click', ()=>pasteInto(vurl));

function absUrl(base, u){
  if(!u) return '';
  if(/^https?:\/\//i.test(u)) return u;
  if(u.startsWith('//')) return 'https:' + u;
  return base.replace(/\/$/,'') + (u.startsWith('/') ? '' : '/') + u;
}

async function fetchTikTok(url){
  const r = await fetch('https://www.tikwm.com/api/?hd=1&url=' + encodeURIComponent(url));
  if(!r.ok) throw new Error('Server TikTok tidak merespons (' + r.status + ')');
  const j = await r.json();
  if(!j || j.code !== 0 || !j.data) throw new Error((j && j.msg) || 'Video tidak ditemukan. Cek linknya.');
  const d = j.data, base = 'https://www.tikwm.com';
  const normal = absUrl(base, d.play);
  const hd = absUrl(base, d.hdplay) || normal;
  if(!normal) throw new Error('Link video tidak tersedia. Mungkin ini postingan foto.');
  return {
    platform:'tiktok', title:d.title || 'Video TikTok',
    author:(d.author && (d.author.nickname || d.author.unique_id)) || 'TikTok',
    cover:absUrl(base, d.cover), normal, hd
  };
}

function guessName(){
  const base = (current && current.title ? current.title : 'video')
    .replace(/[\\/:*?"<>|#\r\n]+/g,' ').trim().slice(0,60) || 'video';
  return base + '.mp4';
}

async function saveFile(link, btn){
  busy(btn, true);
  setStatus($('dlStatus'), 'Mengunduh… tunggu sebentar', '');
  try{
    const r = await fetch(link);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = guessName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 30000);
    setStatus($('dlStatus'), 'Selesai. Cek folder Download di HP kamu.', 'ok');
  }catch(e){
    // Fallback: tautan yang bisa diketuk langsung (aman dari blokir popup / WebView)
    const st = $('dlStatus');
    st.className = 'status ok';
    st.textContent = 'Unduhan otomatis tidak bisa dijalankan. ';
    const a = document.createElement('a');
    a.href = link; a.target = '_blank'; a.rel = 'noopener'; a.download = guessName();
    a.textContent = 'Ketuk di sini untuk membuka / mengunduh video';
    a.style.color = 'var(--ice)';
    st.appendChild(a);
  }finally{
    busy(btn, false);
  }
}

function showResult(d){
  current = d;
  $('rTitle').textContent = d.title;
  $('rMeta').textContent = d.author + ' • ' + d.platform;
  if(d.cover) $('thumb').src = d.cover;
  $('thumb').style.display = d.cover ? '' : 'none';
  $('result').classList.add('show');
}

$('btnFetch').addEventListener('click', async ()=>{
  const url = vurl.value.trim();
  const btn = $('btnFetch');
  $('result').classList.remove('show');
  if(!/^https?:\/\//i.test(url)){ setStatus($('dlStatus'), 'Tempel link lengkap yang diawali https://', 'err'); return; }
  const p = detect(url);
  if(!p){ setStatus($('dlStatus'), 'Link harus dari TikTok.', 'err'); return; }
  busy(btn, true);
  setStatus($('dlStatus'), 'Mengambil data video…', '');
  try{
    const d = await fetchTikTok(url);
    showResult(d);
    setStatus($('dlStatus'), 'Video ditemukan. Pilih kualitas di bawah.', 'ok');
  }catch(e){
    let m = e && e.message ? e.message : 'Gagal mengambil video';
    if(/Failed to fetch|NetworkError|Load failed/i.test(m)) m = 'Gagal terhubung ke server. Cek internet atau coba lagi nanti.';
    setStatus($('dlStatus'), m, 'err');
  }finally{
    busy(btn, false);
  }
});
$('btnNormal').addEventListener('click', ()=>{ if(current && current.normal) saveFile(current.normal, $('btnNormal')); });
$('btnHD').addEventListener('click', ()=>{ if(current && current.hd) saveFile(current.hd, $('btnHD')); });

})();
</script>
</body>
</html>
